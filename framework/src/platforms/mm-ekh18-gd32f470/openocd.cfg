#
# Debug probe configuration for the GD32F470VGT6 dev board, which is fitted with a DAPLink probe
# (CMSIS-DAP compliant) connected via SWD, matched by OpenOCD's stock `interface/cmsis-dap.cfg`.
# This reuses OpenOCD's stock `target/stm32f4x.cfg` (there is no GD32F4xx-specific target script
# in mainline OpenOCD as of this writing) since GD32F4xx is largely register-compatible with
# STM32F4 -- the flash driver in particular may not correctly handle GD32F470's larger/dual-bank
# flash. Verify flash programming works correctly (or use GigaDevice's own GD-Link programming
# tool instead) before relying on this for production programming.
#
# Note: DAPLink also exposes a mass-storage ("drag-and-drop" .bin flashing) interface and a
# virtual serial port alongside its CMSIS-DAP debug interface -- this file only configures the
# CMSIS-DAP/SWD side used by OpenOCD/GDB.
#
# CHIPNAME is set explicitly (rather than relying on target/stm32f4x.cfg's generic "stm32f4x"
# default) so the resulting target name ("gd32f470.cpu") is unique and stable -- this is the exact
# string looked up in framework/tools/platform/configstore.json by `make reconfig`/
# program-configstore.py's auto-detection (see ConfigStoreOpenOCDProgrammer._auto_detect_target())
# to find this platform's mmconfig flash geometry. If this is renamed, update configstore.json's
# key to match.
#
# See framework/src/platforms/mm-ekh18-gd32f470/readme.md and
# framework/src/bsps/gd32f4xx/README-PROVENANCE.md.

set CHIPNAME gd32f470

source [find interface/cmsis-dap.cfg]
transport select swd
# DAPLink comfortably supports higher SWD clock rates than a generic placeholder probe; 2000 kHz
# is a conservative starting point given this platform is not yet verified on real hardware --
# increase (e.g. to 4000-10000) once flashing/debugging is confirmed working reliably.
adapter speed 2000

source [find target/stm32f4x.cfg]

reset_config srst_only srst_nogate

# optional: pass -c "set CONNECT_ASSERT_SRST 1" in openocd command to hold the device in reset
# when connecting to it. This feature is useful if you are unable to connect to your target
# due to incorrect options byte config or illegal program execution.
if { [info exists CONNECT_ASSERT_SRST]} {
    reset_config connect_assert_srst
}

# optional: Specify FreeRTOS as the RTOS. This is used to enable thread aware features.
# pass -c "set RTOS_FREERTOS 1" when running the openocd command.
if { [info exists RTOS_FREERTOS]} {
    $_TARGETNAME configure -rtos FreeRTOS
}

# To enable remote debugging
bindto 0.0.0.0
