#
# PLACEHOLDER debug probe configuration. Unlike the STM32 Nucleo-based mm-ekh08-* platforms
# (which use the Nucleo board's on-board ST-Link, matched by OpenOCD's interface/stlink-v2-1.cfg),
# it is not known what debug probe is fitted to this GD32F470 board. This assumes a generic
# J-Link probe connected via SWD, and reuses OpenOCD's stock `target/stm32f4x.cfg` (there is no
# GD32F4xx-specific target script in mainline OpenOCD as of this writing) since GD32F4xx is
# largely register-compatible with STM32F4 -- the flash driver in particular may not correctly
# handle GD32F470's larger/dual-bank flash. Verify flash programming works correctly (or use
# GigaDevice's own GD-Link/JLink-based programming tool instead) before relying on this for
# production programming.
#
# See framework/src/platforms/mm-ekh08-gd32f470/readme.md and
# framework/src/bsps/gd32f4xx/README-PROVENANCE.md.

adapter driver jlink
transport select swd
adapter speed 2000

source [find target/stm32f4x.cfg]

reset_config srst_only srst_nogate

# optional: pass -c "set CONNECT_ASSERT_SRST 1" in openocd command to hold the device in reset
# when connecting to it. This feature is useful if you are unable to connect to your target
# due to incorrect options byte config or illegal program execution.
if { [info exists CONNECT_ASSERT_SRST]} {
    reset_config connect_assert_srst
}

# optional: Specify FreeRTOS as the RTOS. This is used to enable thread aware features.
# pass -c "set RTOS_FREERTOS 1" when running the openocd command.
if { [info exists RTOS_FREERTOS]} {
    $_TARGETNAME configure -rtos FreeRTOS
}

# To enable remote debugging
bindto 0.0.0.0
