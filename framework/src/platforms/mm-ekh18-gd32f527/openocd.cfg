#
# Debug probe configuration for the GD32F527ZMT7 V1.1 dev board, which is fitted with a DAPLink
# probe (CMSIS-DAP compliant) connected via SWD, matched by OpenOCD's stock `interface/cmsis-dap.cfg`.
#
# CHIPNAME is set to "gd32f527" so the resulting target name ("gd32f527.cpu") is unique and stable
# -- this is the exact string looked up in framework/tools/platform/configstore.json by
# `make reconfig`/program-configstore.py's auto-detection to find this platform's mmconfig flash
# geometry. If this is renamed, update configstore.json's key to match.
#
# GD32F527ZMT7 uses target/stm32f4x.cfg because:
#   - GD32F5xx FMC is at 0x40023C00 (AHB1+0x3C00), identical base and register layout to
#     STM32F4 FLASH -- KEY at +4, STAT at +C, CTL at +10 all match stm32f2x (the flash
#     driver backing stm32f4x.cfg). stm32h7x's flash driver would NOT work here.
#   - OpenOCD's cortex_m target type (used by stm32f4x.cfg) supports all Cortex-M variants
#     including M33, so this works despite the GD32F527 being a Cortex-M33 core.
#   - There is no upstream GD32F5xx-specific target in mainline OpenOCD as of 2026-07.
#
# Note: DAPLink also exposes a mass-storage ("drag-and-drop" .bin) interface and a virtual
# serial port alongside CMSIS-DAP -- this file only configures the CMSIS-DAP/SWD side.

set CHIPNAME gd32f527

source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 2000

source [find target/stm32f4x.cfg]

reset_config srst_only srst_nogate

# optional: pass -c "set CONNECT_ASSERT_SRST 1" in openocd command to hold the device in reset
# when connecting to it. This feature is useful if you are unable to connect to your target
# due to incorrect options byte config or illegal program execution.
if { [info exists CONNECT_ASSERT_SRST]} {
    reset_config connect_assert_srst
}

# optional: Specify FreeRTOS as the RTOS. This is used to enable thread aware features.
# pass -c "set RTOS_FREERTOS 1" when running the openocd command.
if { [info exists RTOS_FREERTOS]} {
    $_TARGETNAME configure -rtos FreeRTOS
}

# To enable remote debugging
bindto 0.0.0.0
